title: Nick van Kemenade
description: Research and projects by Nick van Kemenade.
url: https://nickvankemenade-ai.github.io
baseurl: ""
lang: en

author:
  name: Nick van Kemenade

markdown: kramdown

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  works:
    output: true
    permalink: /works/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: works
    values:
      layout: work

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
