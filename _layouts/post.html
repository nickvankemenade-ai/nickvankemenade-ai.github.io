---
layout: default
---
<article class="article">
  <header class="page-head">
    <a class="back-link" href="{{ '/notes/' | relative_url }}">All notes</a>
    <h1>{{ page.title }}</h1>
    <div class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time>
    </div>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
