<header class="site-header">
  <div class="wrap site-nav">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Main">
      {% for item in site.data.navigation %}
        {% assign current = false %}
        {% if page.url contains item.url %}{% assign current = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if item.button %} class="button button-light"{% endif %}{% if current %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
